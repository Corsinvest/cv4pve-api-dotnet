name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v9.2.4)'
        required: true

permissions:
  contents: write

env:
  # the tag pushed, or the one given to a manual run
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Validate version consistency
      run: |
        # Extract version from Directory.Build.props
        PROPS_VERSION=$(grep -oPm1 '<Version>\K[^<]*' Directory.Build.props)
        # Remove 'v' prefix from tag and compare
        TAG_VERSION=${TAG#v}

        echo "Props version: $PROPS_VERSION"
        echo "Tag version: $TAG_VERSION"

        if [ "$PROPS_VERSION" != "$TAG_VERSION" ]; then
          echo "Error: Version in Directory.Build.props ($PROPS_VERSION) does not match tag version ($TAG_VERSION)"
          exit 1
        fi

    - name: Check if prerelease
      id: prerelease_check
      run: |
        # Check if the tag contains prerelease indicators
        if [[ "$TAG" =~ -(alpha|beta|rc|preview|pre|dev|experimental)$ ]]; then
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract changelog section
      id: changelog
      run: |
        VERSION=${TAG#v}

        if [ ! -f "CHANGELOG.md" ]; then
          exit 0
        fi

        NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found{print}" CHANGELOG.md)

        if [ -z "$NOTES" ]; then
          exit 0
        fi

        echo "Changelog section found for $VERSION"
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        # the release page carries no file to install: link to this version on NuGet
        echo "" >> $GITHUB_OUTPUT
        echo "[NuGet](https://www.nuget.org/packages/Corsinvest.ProxmoxVE.Api/$VERSION)" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack
      run: dotnet pack --configuration Release --output ./nupkgs

    - name: Publish to NuGet
      run: |
        for file in ./nupkgs/*.nupkg; do
          if [ -f "$file" ]; then
            echo "Publishing $file..."
            # --skip-duplicate: a manual rerun after a partial publish skips the packages already there
            dotnet nuget push "$file" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi
        done
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: Release ${{ env.TAG }}
        generate_release_notes: true
        body: ${{ steps.changelog.outputs.notes }}
        draft: false
        prerelease: ${{ steps.prerelease_check.outputs.IS_PRERELEASE }}
